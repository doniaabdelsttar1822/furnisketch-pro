<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>FurniSketch Pro - لوحة التحكم</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f0f2f5; padding: 20px; }
        .panel { max-width: 500px; margin: auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #333; }
        .control-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        select, input { width: 100%; padding: 8px; border-radius: 5px; border: 1px solid #ccc; }
        button { width: 100%; background: #007bff; color: white; padding: 12px; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; margin-top: 10px; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <div class="panel">
        <h2>🎨 لوحة تحكم التصميم</h2>
        
        <div class="control-group">
            <label>اختر الخامة:</label>
            <select id="material">
                <option value="wood">خشب بلوط</option>
                <option value="metal">معدن</option>
                <option value="velvet">مخمل</option>
                <option value="leather">جلد</option>
            </select>
        </div>

        <div class="control-group">
            <label>اختر اللون:</label>
            <input type="color" id="colorPicker" value="#8B4513">
        </div>

        <div class="control-group">
            <label>ستايل التصميم:</label>
            <select id="style">
                <option value="modern">مودرن (عصري)</option>
                <option value="classic">كلاسيك (فخم)</option>
                <option value="industrial">صناعي (Industrial)</option>
            </select>
        </div>

        <button onclick="applyChanges()">تطبيق التعديلات على الرسمة</button>
    </div>

    <script>
        function applyChanges() {
            const material = document.getElementById('material').value;
            const color = document.getElementById('colorPicker').value;
            const style = document.getElementById('style').value;
            
            alert("تم تحديث التصميم بـ: \nالخامة: " + material + "\nاللون: " + color + "\nالستايل: " + style);
            // هنا سنضيف لاحقاً كود ربط الرسمة بهذه القيم
        }
    </script>
</body>
</html>
