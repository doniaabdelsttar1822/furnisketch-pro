<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>FurniSketch AI - الذكاء المحلي</title>
    <script src="https://cdn.jsdelivr.net/npm/@xenova/transformers"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f0f2f5; }
        .box { background: white; padding: 20px; border-radius: 20px; display: inline-block; margin-top: 20px; }
        #imageDisplay { max-width: 300px; margin-top: 10px; border: 2px solid #333; }
    </style>
</head>
<body>
    <div class="box">
        <h1>🎨 الرسام الذكي</h1>
        <input type="file" id="upload" accept="image/*">
        <br>
        <img id="imageDisplay" src="" style="display:none;">
        <p id="status">ارفع رسمة اليد عشان نبدأ!</p>
        <button onclick="processImage()">حول الرسمة لتصميم</button>
    </div>

    <script>
        const upload = document.getElementById('upload');
        const display = document.getElementById('imageDisplay');
        const status = document.getElementById('status');

        upload.onchange = (e) => {
            const reader = new FileReader();
            reader.onload = () => { display.src = reader.result; display.style.display = 'block'; };
            reader.readAsDataURL(e.target.files[0]);
        };

        async function processImage() {
            status.innerText = "جاري التفكير... الرسام الصغير بيحلل الرسمة!";
            // هنا المحرك بيشتغل محلياً بدون إنترنت
            setTimeout(() => {
                status.innerText = "تم التعديل! الرسام ضاف الخامات واللون (محاكاة محليه)";
            }, 3000);
        }
    </script>
</body>
</html>
